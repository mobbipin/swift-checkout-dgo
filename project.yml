name: DgoCheckout
options:
  bundleIdPrefix: com.dgo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  DgoCheckout:
    type: application
    platform: iOS
    sources: [DgoCheckout]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dgo.checkout
        INFOPLIST_KEY_CFBundleDisplayName: DGO Checkout
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  DgoCheckoutTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DgoCheckoutTests]
    dependencies:
      - target: DgoCheckout
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dgo.checkout.tests
  DgoCheckoutUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DgoCheckoutUITests]
    dependencies:
      - target: DgoCheckout
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dgo.checkout.uitests
        TEST_TARGET_NAME: DgoCheckout
schemes:
  DgoCheckout:
    build:
      targets:
        DgoCheckout: all
    test:
      targets: [DgoCheckoutTests, DgoCheckoutUITests]
